<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piccolo Mondo — Arbia, Siena</title>
<meta name="description" content="Piccolo Mondo — Pizzeria &amp; Trattoria dal 1985, Arbia (Siena).">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript>Questo sito richiede JavaScript per mostrare il menu. / This site requires JavaScript to display the menu.</noscript>

<header class="site-header">
  <div class="site-header__inner">
    <a href="#top" class="brand">Piccolo Mondo</a>
    <div class="lang-toggle" role="group" aria-label="Lingua / Language">
      <button type="button" class="lang-btn" data-lang="it" aria-pressed="true">IT</button>
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
  <nav class="chip-nav" aria-label="Categorie menu">
    <div class="chip-nav__track" id="chip-track"></div>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <p class="eyebrow" data-i18n="hero_eyebrow">dal 1985</p>
    <h1 class="hero__title">Piccolo Mondo</h1>
    <p class="hero__tagline" id="hero-tagline"></p>
    <a href="#menu" class="cta" id="hero-cta" data-i18n="hero_cta">Scopri il menu</a>
  </section>

  <div class="menu-layout" id="menu">
    <nav class="rail" aria-label="Categorie menu">
      <div class="rail__inner" id="rail-track"></div>
    </nav>

    <div class="menu-content">
      <h2 class="section-title" data-i18n="menu_title">Menu</h2>
      <div id="menu-categories"></div>
    </div>
  </div>

  <section class="contatti" id="contatti">
    <p class="eyebrow" data-i18n="nav_contatti">Contatti</p>
    <h2 class="section-title" data-i18n="contatti_title">Contatti</h2>
    <div class="contatti__grid" id="contatti-grid"></div>
  </section>

  <section class="allergeni" id="allergeni">
    <p class="eyebrow" data-i18n="nav_allergeni">Allergeni</p>
    <h2 class="section-title" data-i18n="allergeni_title">Allergeni</h2>
    <p class="allergeni__text" id="allergeni-text"></p>
  </section>
</main>

<footer class="site-footer">
  <p id="footer-text"></p>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
