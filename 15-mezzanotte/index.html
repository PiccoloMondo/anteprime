<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piccolo Mondo — Pizzeria &amp; Trattoria, Arbia (Siena)</title>
<meta name="description" content="Piccolo Mondo — pizzeria e trattoria ad Arbia, Siena, dal 1985. Menu, orari e contatti.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip" href="#menu">Menu</a>

<header class="site-head">
  <div class="head-inner">
    <a class="wordmark" href="#top">
      <span class="wordmark-name">Piccolo Mondo</span>
      <span class="wordmark-since">Arbia &middot; Siena</span>
    </a>

    <nav class="head-nav" aria-label="Principale">
      <a href="#menu" data-i18n="nav_menu">Menu</a>
      <a href="#contatti" data-i18n="nav_contatti">Contatti</a>
      <a href="#allergeni" data-i18n="nav_allergeni">Allergeni</a>
    </nav>

    <div class="lang" role="group" aria-label="Lingua" id="langGroup">
      <span class="lang-label" data-i18n="lang_toggle_label">Lingua</span>
      <button type="button" class="lang-btn" data-lang="it" aria-pressed="true">IT</button>
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<noscript>
  <p class="noscript">Questo menu richiede JavaScript. Attivalo per vedere i piatti e i prezzi. &mdash;
  This menu requires JavaScript. Please enable it to view the dishes and prices.</p>
</noscript>

<main id="top">

  <section class="hero" aria-labelledby="heroTitle">
    <div class="hero-inner">
      <p class="hero-eyebrow" data-i18n="hero_eyebrow">dal 1985</p>
      <h1 class="hero-title" id="heroTitle">Piccolo Mondo</h1>
      <p class="hero-rule" aria-hidden="true">&#9670;</p>
      <p class="hero-tagline" id="heroTagline">Pizzeria &amp; Trattoria dal 1985</p>
      <a class="hero-cta" href="#menu" data-i18n="hero_cta">Scopri il menu</a>
    </div>
  </section>

  <section class="menu" id="menu" aria-labelledby="menuTitle">
    <div class="menu-shell">

      <nav class="rail" id="rail" aria-label="Categorie del menu">
        <p class="rail-title" aria-hidden="true">Menu</p>
        <ul class="rail-list" id="railList"></ul>
      </nav>

      <div class="menu-col">
        <h2 class="section-title" id="menuTitle" data-i18n="menu_title">Menu</h2>
        <div id="categories"></div>
      </div>

    </div>
  </section>

  <section class="block" id="contatti" aria-labelledby="contattiTitle">
    <div class="block-inner">
      <h2 class="section-title" id="contattiTitle" data-i18n="contatti_title">Contatti</h2>
      <dl class="contact">
        <div class="contact-row">
          <dt data-i18n="label_address">Indirizzo</dt>
          <dd><a id="addressLink" href="#" rel="noopener noreferrer" target="_blank"></a></dd>
        </div>
        <div class="contact-row">
          <dt data-i18n="label_phone">Telefono</dt>
          <dd><a id="phoneLink" href="#"></a></dd>
        </div>
        <div class="contact-row">
          <dt data-i18n="label_hours">Orari</dt>
          <dd><span id="hours"></span><span class="closed" id="closed"></span></dd>
        </div>
        <div class="contact-row">
          <dt data-i18n="label_follow">Seguici</dt>
          <dd class="socials">
            <a id="fbLink" href="#" rel="noopener noreferrer" target="_blank">Facebook</a>
            <a id="igLink" href="#" rel="noopener noreferrer" target="_blank">Instagram</a>
          </dd>
        </div>
      </dl>
    </div>
  </section>

  <section class="block block-quiet" id="allergeni" aria-labelledby="allergeniTitle">
    <div class="block-inner">
      <h2 class="quiet-title" id="allergeniTitle" data-i18n="allergeni_title">Allergeni</h2>
      <p class="quiet-text" data-i18n="allergeni_text"></p>
    </div>
  </section>

</main>

<footer class="site-foot">
  <div class="block-inner foot-inner">
    <p class="foot-name">Piccolo Mondo</p>
    <p class="foot-meta"><span id="footYear"></span> &middot; Arbia (Siena)</p>
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
